# Builds and runs the tests on every push and pull request. Publishes nothing.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tags are handled by release.yml
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false   # a failure on one OS must not hide the others' results
      matrix:
        # Text is measured with the fonts installed on each OS, so all three are worth testing.
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash   # Git Bash on Windows, so ./mvnw works the same everywhere
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: target/surefire-reports
          retention-days: 7

      # Run the jar as a user would: it must render the example as SVG and as a dark PNG
      # (AWT drawing on each OS's fonts), and fail with the documented exit codes on bad
      # usage (2) and on a syntax error (1).
      - name: Run the jar
        run: |
          java -jar target/raspa.jar docs/example.raspa
          test -s docs/example.svg
          java -jar target/raspa.jar --png --dark-mode docs/example.raspa
          test "$(head -c 8 docs/example.png | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a
          set +e
          java -jar target/raspa.jar; usage=$?
          printf 'Effect\n\tTab\n' > bad.raspa
          java -jar target/raspa.jar bad.raspa; syntax=$?
          set -e
          test "$usage" = 2 || { echo "no arguments exited with $usage, not 2"; exit 1; }
          test "$syntax" = 1 || { echo "a syntax error exited with $syntax, not 1"; exit 1; }
