# Pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) runs the tests and publishes
# raspa-<version>.jar in a GitHub Release. The jar is plain Java, so one runner builds it for all OSes.
name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to create the Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The version lives in pom.xml; a tag that disagrees with it would publish a mislabelled jar.
      - name: Check the tag matches the pom version
        run: |
          pom=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          tag="${GITHUB_REF_NAME#v}"
          test "$pom" = "$tag" || { echo "tag $GITHUB_REF_NAME but pom.xml says $pom"; exit 1; }

      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp target/raspa.jar "raspa-$version.jar"
          gh release create "$GITHUB_REF_NAME" "raspa-$version.jar" \
            --title "Raspa $version" \
            --generate-notes
